<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Drop Travel Gilgit-Baltistan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white font-sans">

  <!-- Header -->
  <header class="p-4 flex justify-between items-center border-b border-gray-800 bg-gray-950 sticky top-0 z-50">
    <h1 class="text-lg font-bold text-emerald-400"><i class="fa-solid fa-mountain-city mr-2"></i>Secure Drop GB</h1>
    <div class="flex items-center gap-3">
      <span id="userEmail" class="text-xs text-gray-400"></span>
      <button onclick="logout()" class="bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1 rounded text-xs font-semibold">Logout</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 space-y-4 pb-20">

    <!-- 1. Weather & Road Status Alert -->
    <div class="bg-amber-500/10 border border-amber-500/30 p-3 rounded-xl flex items-start gap-3">
      <i class="fa-solid fa-triangle-exclamation text-amber-400 mt-1"></i>
      <div>
        <h3 class="text-xs font-bold text-amber-300">Live Road & Weather Alert</h3>
        <p class="text-[11px] text-gray-300">Babusar Top is currently open. Weather in Hunza & Skardu is clear. Drive safely!</p>
      </div>
    </div>

    <!-- 2. Booking Card -->
    <div class="bg-gray-800 p-5 rounded-2xl shadow-xl border border-gray-700">
      <h2 class="text-xl font-bold mb-3 text-center">Book Safe Ride in GB</h2>
      
      <form id="bookingForm" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Pickup Location</label>
          <select id="pickup" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
            <option>Gilgit Airport</option>
            <option>Skardu Airport</option>
            <option>Hunza Valley</option>
            <option>Astore (Rama)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Drop Location</label>
          <select id="drop" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
            <option>Hunza Valley</option>
            <option>Skardu City</option>
            <option>Deosai Plains</option>
            <option>Fairy Meadows</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Vehicle Type & Fare Estimate</label>
          <select id="vehicle" onchange="calculateFare()" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-500">
            <option value="5000">Corolla / Sedan (City) - Est: PKR 5,000</option>
            <option value="12000" selected>4x4 Prado / Jeep (Off-road) - Est: PKR 12,000</option>
            <option value="18000">HiAce Van (Group Trip) - Est: PKR 18,000</option>
          </select>
        </div>

        <div class="bg-gray-900 p-3 rounded-lg flex justify-between items-center border border-gray-800">
          <span class="text-xs text-gray-400">Fixed Transparent Fare:</span>
          <span id="fareDisplay" class="text-emerald-400 font-bold text-sm">PKR 12,000</span>
        </div>

        <button type="button" onclick="confirmBooking()" class="w-full bg-emerald-500 hover:bg-emerald-600 py-3 rounded-lg font-bold text-sm transition">
          Book Verified Driver
        </button>
      </form>
    </div>

    <!-- 3. Safety & Emergency Grid (SOS & Live Tracking) -->
    <div class="grid grid-cols-2 gap-3">
      <button onclick="triggerSOS()" class="bg-red-600/20 border border-red-500/40 hover:bg-red-600/30 p-3 rounded-xl text-center transition">
        <i class="fa-solid fa-triangle-exclamation text-red-400 text-lg mb-1 block"></i>
        <span class="text-xs font-bold text-red-300">Emergency SOS</span>
      </button>

      <button onclick="shareLocation()" class="bg-blue-600/20 border border-blue-500/40 hover:bg-blue-600/30 p-3 rounded-xl text-center transition">
        <i class="fa-solid fa-location-arrow text-blue-400 text-lg mb-1 block"></i>
        <span class="text-xs font-bold text-blue-300">Share Live GPS</span>
      </button>
    </div>

    <!-- 4. Verified Drivers & Features Badges -->
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
      <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Why Travel With Us?</h3>
      <div class="grid grid-cols-3 gap-2 text-center text-[11px] text-gray-300">
        <div class="p-2 bg-gray-900 rounded"><i class="fa-solid fa-shield-halved text-emerald-400 block mb-1"></i>Verified CNIC</div>
        <div class="p-2 bg-gray-900 rounded"><i class="fa-solid fa-star text-amber-400 block mb-1"></i>4.9★ Rated</div>
        <div class="p-2 bg-gray-900 rounded"><i class="fa-solid fa-phone-slash text-blue-400 block mb-1"></i>Offline Mode</div>
      </div>
    </div>

  </main>

  <!-- Firebase Scripts & Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAfFNeNiZD-pV4-Xwrom6z5-yQ6b5Bk5kQ",
      authDomain: "talkzone-3dd4a.firebaseapp.com",
      databaseURL: "https://talkzone-3dd4a-default-rtdb.firebaseio.com",
      projectId: "talkzone-3dd4a",
      storageBucket: "talkzone-3dd4a.firebasestorage.app",
      messagingSenderId: "690220216857",
      appId: "1:690220216857:web:8371be61ea544b69bc7088"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Check if user is logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('userEmail').innerText = user.email || "User";
      } else {
        // Agar login nahi hai toh login page par bhej dein
        window.location.href = "login.html";
      }
    });

    window.logout = function() {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    }

    window.calculateFare = function() {
      const vehicleSelect = document.getElementById('vehicle');
      const fare = vehicleSelect.value;
      document.getElementById('fareDisplay').innerText = `PKR ${Number(fare).toLocaleString()}`;
    }

    window.confirmBooking = function() {
      const pickup = document.getElementById('pickup').value;
      const drop = document.getElementById('drop').value;
      const vehicleText = document.getElementById('vehicle').options[document.getElementById('vehicle').selectedIndex].text;
      const fare = document.getElementById('vehicle').value;

      const bookingsRef = ref(db, 'bookings/');
      const newBooking = push(bookingsRef);

      set(newBooking, {
        pickup,
        drop,
        vehicle: vehicleText,
        fare: fare,
        timestamp: new Date().toISOString()
      }).then(() => {
        alert(`Bokking Confirmed!\nRoute: ${pickup} to ${drop}\nFare: PKR ${fare}\nHum jald ap se rabta karengay.`);
      }).catch((error) => {
        alert("Error: " + error.message);
      });
    }

    window.triggerSOS = function() {
      if(confirm("Kya ap waqayi Emergency SOS alert bhejna chahte hain? Yeh local rescue aur apke contacts ko alert kar dega.")) {
        alert("SOS Alert Sent! Local rescue team aur administrators ko ap ki request bhej di gayi hai.");
      }
    }

    window.shareLocation = function() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;
          alert(`Ap ki live location copy ho gayi hai:\n${mapsLink}\nAap ise WhatsApp par share kar sakte hain.`);
        }, () => {
          alert("Location access deny ho gaya hai. Baraye meherbani GPS on karein.");
        });
      } else {
        alert("Geolocation is not supported by your browser.");
      }
    }
  </script>
</body>
              </html>
